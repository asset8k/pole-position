[project]
name = "pole-position"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asset", email = "asset8k@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.16.2",
    "pwdlib>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
pole-position = "pole_position:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
